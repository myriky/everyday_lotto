name: Weekly Lotto Result

env:
  DH_LOTTERY_USER_ID: ${{ secrets.DH_LOTTERY_USER_ID }}
  DH_LOTTERY_PASSWORD: ${{ secrets.DH_LOTTERY_PASSWORD }}
  SLACK_BOT_TOKEN: ${{ vars.SLACK_BOT_TOKEN }}
  SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}

on:
  schedule:
    # 토요일 23:00 KST (추첨 20:45 + 결과 반영 약 1시간 + cron 지연 여유)
    - cron: "0 14 * * 6"
  workflow_dispatch:

jobs:
  result:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Korean fonts (스크린샷 한글 렌더링용)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - run: npm ci
      - run: npm run result
